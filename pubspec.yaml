name: edukardex_flutter
description: MVP de registro de estudiantes - EduKardex (Tu Conexión Escolar)
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  cupertino_icons: ^1.0.6
  supabase_flutter: ^2.17.1
  flutter_dotenv: ^5.2.1
  provider: ^6.1.2
  google_fonts: ^6.2.1
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/
    - lib/assets/
